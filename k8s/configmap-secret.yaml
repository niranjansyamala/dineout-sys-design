apiVersion: v1
kind: Namespace
metadata:
  name: dineout
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: dineout
data:
  SPRING_PROFILES_ACTIVE: "production"
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "dineout_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: dineout
type: Opaque
stringData:
  DB_USERNAME: "postgres"
  DB_PASSWORD: "postgres"
